<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>Printer agenti</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--tx:#e2e8f0;--mut:#94a3b8;--ac:#38bdf8;--ok:#4ade80;--er:#f87171}
@media(prefers-color-scheme:light){:root{--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--mut:#64748b;--ac:#0284c7;--ok:#16a34a;--er:#dc2626}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;padding:16px;max-width:640px;margin:auto}
h1{font-size:18px}.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #33415566;background:transparent;color:var(--tx);font-size:15px}
select option{color:#000}
button{padding:10px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-weight:600;margin:10px 8px 0 0;cursor:pointer}
button.sec{background:transparent;border:1px solid var(--ac);color:var(--ac)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--er);margin-right:6px}.dot.on{background:var(--ok)}
.mut{color:var(--mut);font-size:13px}.er{color:var(--er)}.ok{color:var(--ok)}.l{padding:6px 0;border-top:1px solid #33415544}
</style></head><body>
<h1>🖨 Printer agenti <span class="mut" id="host"></span></h1>
<div class="card"><span class="dot" id="dot"></span><b id="st">…</b><div class="er" id="err"></div><div class="mut">Chop etilgan: <span id="cnt">0</span></div></div>
<div class="card"><b>Printer</b>
  <label>Telefondan kelgan vazifalar shu printerdan chiqadi</label><select id="printer"></select>
  <button id="refresh" class="sec">↻ Ro'yxatni yangilash</button><button id="test">Sinov etiketkasi</button></div>
<div class="card"><b>Serverga ulanish</b>
  <label>Server manzili</label><input id="url" placeholder="https://sizning-server.uz">
  <label>Agent kaliti <span class="mut" id="hasKey"></span></label><input id="key" type="password" placeholder="o'zgartirish uchun kiriting">
  <button id="save">Saqlash</button></div>
<div class="card"><b>Oxirgi chop etishlar</b><div id="log"></div></div>
<script>
const $=id=>document.getElementById(id);let editing=false;
const post=(p,b)=>fetch(p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b||{})}).then(async r=>{const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j});
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function load(){
  const s=await fetch('/state').then(r=>r.json());
  $('host').textContent='· '+s.host;$('dot').classList.toggle('on',s.connected);$('st').textContent=s.connected?'Serverga ulangan':'Ulanmagan';
  $('err').textContent=s.error;$('cnt').textContent=s.printed;$('hasKey').textContent=s.config.hasKey?'(saqlangan)':'';
  if(!editing){$('url').value=s.config.serverUrl;}
  const sel=$('printer'),cur=s.config.printer;
  if(document.activeElement!==sel){const list=s.printers.includes(cur)||!cur?s.printers:[cur,...s.printers];
    sel.innerHTML='<option value="">— tanlang —</option>'+list.map(n=>`<option ${n===cur?'selected':''}>${esc(n)}</option>`).join('');}
  $('log').innerHTML=s.log.map(l=>`<div class="l ${l.ok?'':'er'}">${new Date(l.at).toLocaleTimeString()} · ${esc(l.text)}</div>`).join('')||'<div class="mut">Hali yo\'q</div>';
}
$('url').oninput=()=>editing=true;
$('printer').onchange=()=>post('/config',{printer:$('printer').value}).then(load);
$('refresh').onclick=()=>post('/refresh').then(load);
$('test').onclick=()=>post('/test').then(()=>alert('Yuborildi')).catch(e=>alert(e.message));
$('save').onclick=()=>post('/config',{serverUrl:$('url').value,agentKey:$('key').value}).then(()=>{$('key').value='';editing=false;load()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
load();setInterval(load,3000);
</script></body></html>
