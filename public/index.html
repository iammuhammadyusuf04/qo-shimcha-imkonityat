<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<title>Ombor va Chop</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--tx:#e2e8f0;--mut:#94a3b8;--ac:#38bdf8;--ok:#4ade80;--er:#f87171}
@media(prefers-color-scheme:light){:root{--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--mut:#64748b;--ac:#0284c7;--ok:#16a34a;--er:#dc2626}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding:0 16px 90px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
h1{font-size:18px;margin:0}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--er);margin-right:6px}.dot.on{background:var(--ok)}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #33415566;background:transparent;color:var(--tx);font-size:16px}
.row{display:flex;gap:8px}.row>*{flex:1}
button{padding:12px 16px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:16px;font-weight:600;width:100%;margin-top:12px}
button.sec{background:transparent;border:1px solid var(--ac);color:var(--ac)}button.sm{width:auto;margin:0;padding:8px 12px;font-size:14px}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #33415544}
.item:first-child{border-top:0}.grow{flex:1;min-width:0}.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mut{color:var(--mut);font-size:13px}.tag{font-size:12px;padding:2px 8px;border-radius:99px;margin-right:4px;border:1px solid}
.ok{color:var(--ok)}.error{color:var(--er)}.skipped{color:var(--mut)}
.qty{width:64px;padding:8px;text-align:center}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
nav button{margin:0 4px;background:transparent;color:var(--mut)}nav button.on{color:var(--ac)}
#toast{position:fixed;top:12px;left:16px;right:16px;padding:12px;border-radius:10px;background:var(--card);border:1px solid var(--ac);display:none;z-index:9}
.hide{display:none}
</style>
</head>
<body>
<div id="toast"></div>
<header><h1>📦 Ombor va Chop</h1><span class="mut"><span id="dot" class="dot"></span><span id="agent">agent?</span></span></header>

<section id="login" class="card hide">
  <label>API kalit</label><input id="key" type="password" autocomplete="off">
  <button id="saveKey">Kirish</button>
</section>

<section id="tab-add" class="card">
  <label>Nomi *</label><input id="name">
  <div class="row"><div><label>Sotish narxi</label><input id="price" type="number" inputmode="decimal"></div>
  <div><label>Tannarx</label><input id="cost" type="number" inputmode="decimal"></div></div>
  <div class="row"><div><label>Soni</label><input id="quantity" type="number" inputmode="decimal"></div>
  <div><label>Birlik</label><select id="unit"><option>dona</option><option>kg</option><option>litr</option><option>metr</option><option>quti</option></select></div></div>
  <label>Shtrix-kod</label>
  <div class="row"><input id="barcode" inputmode="numeric"><button id="gen" class="sec sm" style="flex:0 0 auto">Yaratish</button></div>
  <label>Toifa</label><input id="category">
  <button id="save">Saqlash va POS/omborga yuborish</button>
  <label style="margin-top:12px"><input type="checkbox" id="printAfter" style="width:auto"> Saqlagach etiketka chop etish</label>
</section>

<section id="tab-list" class="hide">
  <input id="q" placeholder="Qidirish: nom, shtrix-kod…" style="margin-bottom:12px">
  <div class="card" id="list"></div>
  <div class="card"><label>Printer formati</label>
    <select id="format"><option value="tspl">Etiketka (TSPL)</option><option value="escpos">Chek (ESC/POS)</option></select>
    <button id="print">Tanlanganlarni chop etish</button></div>
</section>

<section id="tab-jobs" class="hide"><div class="card" id="jobs"></div></section>

<nav><button data-t="add" class="on">➕ Qo'shish</button><button data-t="list">🏷 Narxlar</button><button data-t="jobs">🖨 Navbat</button></nav>

<script>
const $=id=>document.getElementById(id);
let KEY=localStorage.getItem('key')||'';const picked=new Map();
const toast=(m,e)=>{const t=$('toast');t.textContent=m;t.style.borderColor=e?'var(--er)':'var(--ac)';t.style.display='block';setTimeout(()=>t.style.display='none',3500)};
async function api(path,opt={}){
  const r=await fetch('/api'+path,{...opt,headers:{'x-api-key':KEY,'content-type':'application/json'},body:opt.body?JSON.stringify(opt.body):undefined});
  const j=await r.json().catch(()=>({}));
  if(r.status===401){$('login').classList.remove('hide');throw new Error('Kalit noto\'g\'ri')}
  if(!r.ok)throw new Error(j.error||r.status);return j;
}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>new Intl.NumberFormat('ru-RU').format(n||0);
$('saveKey').onclick=()=>{KEY=$('key').value.trim();localStorage.setItem('key',KEY);$('login').classList.add('hide');refresh()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  for(const t of['add','list','jobs'])$('tab-'+t).classList.toggle('hide',t!==b.dataset.t);
  refresh();
});
$('gen').onclick=()=>{$('barcode').value='2'+String(Date.now()).slice(-11)+Math.floor(Math.random()*10)};
const tags=p=>['pos','ombor'].map(t=>{const s=p.sync?.[t];const st=s?.state||'skipped';
  return `<span class="tag ${st}" title="${esc(s?.error||'')}">${t==='pos'?'POS':'Ombor'}: ${st==='ok'?'✓':st==='error'?'✗':'—'}</span>`}).join('');
$('save').onclick=async()=>{
  try{
    const body={};for(const k of['name','price','cost','quantity','unit','barcode','category'])body[k]=$(k).value;
    const p=await api('/products',{method:'POST',body});
    toast('Saqlandi: '+p.name);
    if($('printAfter').checked)await api('/print',{method:'POST',body:{items:[{productId:p.id,copies:1}],format:$('format').value}});
    for(const k of['name','price','cost','quantity','barcode','category'])$(k).value='';
    if(Object.values(p.sync||{}).some(s=>s.state==='error'))toast('Saqlandi, lekin yuborishda xato bor (Narxlar bo\'limida qayta urining)',1);
  }catch(e){toast(e.message,1)}
};
async function loadList(){
  const list=await api('/products?q='+encodeURIComponent($('q').value));
  $('list').innerHTML=list.length?list.map(p=>`<div class="item"><input type="checkbox" data-id="${p.id}" ${picked.has(p.id)?'checked':''} style="width:auto">
    <div class="grow"><div class="nm">${esc(p.name)}</div><div class="mut">${money(p.price)} so'm · ${esc(p.barcode||'—')}</div><div>${tags(p)}</div></div>
    <input class="qty" type="number" min="1" value="${picked.get(p.id)||1}" data-q="${p.id}">
    <button class="sec sm" data-sync="${p.id}">↻</button></div>`).join(''):'<div class="mut">Tovar yo\'q</div>';
  $('list').querySelectorAll('[data-id]').forEach(c=>c.onchange=()=>c.checked?picked.set(c.dataset.id,+document.querySelector(`[data-q="${c.dataset.id}"]`).value||1):picked.delete(c.dataset.id));
  $('list').querySelectorAll('[data-q]').forEach(c=>c.onchange=()=>picked.has(c.dataset.q)&&picked.set(c.dataset.q,+c.value||1));
  $('list').querySelectorAll('[data-sync]').forEach(b=>b.onclick=async()=>{try{await api(`/products/${b.dataset.sync}/sync`,{method:'POST'});loadList()}catch(e){toast(e.message,1)}});
}
$('q').oninput=loadList;
$('print').onclick=async()=>{
  if(!picked.size)return toast('Tovar tanlang',1);
  try{await api('/print',{method:'POST',body:{format:$('format').value,items:[...picked].map(([productId,copies])=>({productId,copies}))}});
    toast('Chop etishga yuborildi');picked.clear();loadList()}catch(e){toast(e.message,1)}
};
async function loadJobs(){
  const j=await api('/jobs');
  $('jobs').innerHTML=j.map(x=>`<div class="item"><div class="grow"><div class="nm">${esc(x.summary)}</div><div class="mut">${new Date(x.createdAt).toLocaleString()}</div></div>
    <span class="${x.status==='done'?'ok':x.status==='failed'?'error':'mut'}" title="${esc(x.error||'')}">${x.status}</span></div>`).join('')||'<div class="mut">Bo\'sh</div>';
}
async function refresh(){
  try{
    const s=await api('/status');$('dot').classList.toggle('on',s.agentOnline);$('agent').textContent=s.agentOnline?'printer onlayn':'printer oflayn';
    if(!$('tab-list').classList.contains('hide'))await loadList();
    if(!$('tab-jobs').classList.contains('hide'))await loadJobs();
  }catch{}
}
if(!KEY)$('login').classList.remove('hide');else refresh();
setInterval(refresh,4000);
</script>
</body>
</html>
